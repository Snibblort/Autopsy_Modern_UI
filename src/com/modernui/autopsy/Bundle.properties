OpenIDE-Module-Name=Autopsy Modern UI
OpenIDE-Module-Display-Category=Appearance
OpenIDE-Module-Short-Description=Gives Autopsy a modern flat look with light and dark themes.
OpenIDE-Module-Long-Description=\
    Switches Autopsy to the FlatLaf look and feel that ships with Autopsy's NetBeans platform, \
    with a choice of light or dark themes, accent colors, corner styles, row density and a modern \
    title bar. Settings are under Tools > Options > Modern UI and take effect after restarting Autopsy.
